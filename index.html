    <style>
        :root {
            --primary: #1a237e;
            --primary-light: #283593;
            --accent: #efba0a;
            --accent-2: #ffffff;
            --accent-light: #ff9100;
            --success: #2e7d32;
            --warning: #f9a825;
            --danger: #c62828;
            --info: #0277bd;
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #212121;
            --text-light: #616161;
            --border: #e0e0e0;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            --font: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: linear-gradient(135deg, #e8eaf6 0%, #f5f6fa 30%, #e3f2fd 60%, #fce4ec 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
            position: relative;
        }
        .bg-particles {
            position: fixed; top:0; left:0; width:100%; height:100%;
            pointer-events: none; z-index:0; overflow: hidden;
        }
        .particle {
            position: absolute; border-radius:50%; background: var(--primary);
            opacity:0.06; animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity:0; }
            10% { opacity:0.06; }
            90% { opacity:0.06; }
            100% { transform: translateY(-10vh) scale(1.5); opacity:0; }
        }
        .app-container { position:relative; z-index:1; max-width:1400px; margin:0 auto; padding:16px; }
        .app-header {
            background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #1a237e 100%);
            color:#fff; border-radius:var(--radius); padding:20px 28px;
            margin-bottom:20px; display:flex; align-items:center; justify-content:space-between;
            flex-wrap:wrap; gap:16px; box-shadow:var(--shadow-lg);
            position:relative; overflow:hidden; animation:slideDown 0.6s ease-out;
        }
        @keyframes slideDown { from { transform: translateY(-40px); opacity:0; } to { transform: translateY(0); opacity:1; } }
        .header-logo { display:flex; align-items:center; gap:14px; z-index:1; }
        .header-logo .logo-icon {
            width:60px; height:60px; background:var(--accent-2); border-radius:14px;
            display:flex; align-items:center; justify-content:center;
            font-size:26px; font-weight:900; box-shadow:0 6px 20px rgba(255,109,0,0.4);
            animation:pulse 2s infinite; overflow:hidden;
        }
        .header-logo .logo-icon img { width:100%; height:100%; object-fit:cover; display:block; }
        @keyframes pulse {
            0%,100% { box-shadow:0 6px 20px rgba(255,109,0,0.4); }
            50% { box-shadow:0 6px 35px rgba(255,109,0,0.7); }
        }
        .header-title { font-size:1.4rem; font-weight:700; letter-spacing:-0.3px; line-height:1.2; }
        .header-subtitle { font-size:0.8rem; opacity:0.85; font-weight:400; letter-spacing:1px; }
        .header-actions { display:flex; gap:10px; z-index:1; flex-wrap:wrap; }
        .btn {
            padding:10px 20px; border-radius:25px; border:none; cursor:pointer;
            font-weight:600; font-size:0.9rem; letter-spacing:0.3px; transition:var(--transition);
            display:inline-flex; align-items:center; gap:6px; text-decoration:none; white-space:nowrap;
        }
        .btn-primary { background:var(--accent); color:#fff; box-shadow:0 4px 14px rgba(255,109,0,0.35); }
        .btn-primary:hover { background:var(--accent-light); transform:translateY(-2px); box-shadow:0 8px 22px rgba(255,109,0,0.45); }
        .btn-outline { background:transparent; color:#fff; border:2px solid rgba(255,255,255,0.5); }
        .btn-outline:hover { background:rgba(255,255,255,0.1); border-color:#fff; transform:translateY(-2px); }
        .btn-sm { padding:6px 14px; font-size:0.8rem; border-radius:20px; }
        .btn-success { background:var(--success); color:#fff; }
        .btn-danger { background:var(--danger); color:#fff; }
        .btn-info { background:var(--info); color:#fff; }
        .btn-warning { background:var(--warning); color:#212121; }
        .btn-ghost { background:transparent; color:var(--text); border:1.5px solid var(--border); }
        .btn-gallery { background:linear-gradient(135deg, #4CAF50, #2e7d32); color:#fff; box-shadow:0 4px 14px rgba(46,125,50,0.35); }
        .card {
            background:var(--card-bg); border-radius:var(--radius); padding:24px;
            box-shadow:var(--shadow); transition:var(--transition); border:1px solid transparent;
            animation:fadeInUp 0.5s ease-out forwards; position:relative; overflow:hidden;
        }
        .card:hover { box-shadow:var(--shadow-lg); border-color:#e8eaf6; transform:translateY(-2px); }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .card-header { font-size:1.15rem; font-weight:700; margin-bottom:16px; color:var(--primary); display:flex; align-items:center; gap:8px; }
        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-weight:600; font-size:0.85rem; margin-bottom:5px; color:var(--text); }
        .form-group input, .form-group select {
            width:100%; padding:11px 15px; border:2px solid var(--border); border-radius:25px;
            font-size:0.95rem; transition:var(--transition); background:#fafafa; font-family:var(--font);
        }
        .form-group input:focus, .form-group select:focus {
            outline:none; border-color:var(--primary); background:#fff; box-shadow:0 0 0 4px rgba(26,35,126,0.08);
        }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        @media (max-width:600px) { .form-row { grid-template-columns:1fr; } }
        .badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:0.75rem; font-weight:600; }
        .badge-success { background:#e8f5e9; color:#2e7d32; }
        .badge-warning { background:#fff8e1; color:#f57f17; }
        .badge-info { background:#e1f5fe; color:#0277bd; }
        .modal-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.55); z-index:1000; display:flex; align-items:center; justify-content:center;
            animation:fadeIn 0.25s ease;
        }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        .modal {
            background:#fff; border-radius:var(--radius); padding:28px; max-width:600px; width:95%;
            max-height:85vh; overflow-y:auto; box-shadow:var(--shadow-lg); animation:modalPop 0.3s ease;
        }
        @keyframes modalPop { from { transform:scale(0.9); opacity:0; } to { transform:scale(1); opacity:1; } }
        .modal-close { float:right; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text-light); }
        .spinner {
            width:40px; height:40px; border:4px solid #e0e0e0; border-top:4px solid var(--primary);
            border-radius:50%; animation:spin 0.8s linear infinite; margin:40px auto;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .toast {
            position:fixed; bottom:30px; right:30px; background:#212121; color:#fff; padding:14px 22px;
            border-radius:25px; font-weight:600; z-index:2000;
            animation:slideInRight 0.4s ease, fadeOutRight 0.4s ease 2.6s forwards;
            box-shadow:var(--shadow-lg); font-size:0.9rem;
        }
        .toast-top {
            position:fixed; top:30px; right:30px; background:#212121; color:#fff; padding:14px 22px;
            border-radius:25px; font-weight:600; z-index:2000;
            animation:slideInRight 0.4s ease, fadeOutRight 0.4s ease 2.6s forwards;
            box-shadow:var(--shadow-lg); font-size:0.9rem;
        }
        @media (max-width:600px) {
            .toast-top { top:10px; right:10px; left:10px; text-align:center; border-radius:15px; font-size:0.8rem; padding:10px 16px; }
            .toast { bottom:20px; right:10px; left:10px; text-align:center; border-radius:15px; font-size:0.8rem; padding:10px 16px; }
        }
        .toast-success { background:#2e7d32; }
        .toast-error { background:#c62828; }
        @keyframes slideInRight { from { transform:translateX(120%); opacity:0; } to { transform:translateX(0); opacity:1; } }
        @keyframes fadeOutRight { from { transform:translateX(0); opacity:1; } to { transform:translateX(120%); opacity:0; } }
        .footer { text-align:center; padding:20px; color:#464545; font-size:0.9rem; margin-top:auto; }
        .text-center { text-align:center; }
        .mt-2 { margin-top:12px; }
        .w-full { width:100%; }
        .success-card {
            background:linear-gradient(145deg, #ffffff, #f8f9ff); border:2px solid #1a237e;
            border-radius:20px; padding:30px 24px; text-align:center; max-width:450px; margin:0 auto;
            position:relative; overflow:hidden; box-shadow:0 10px 40px rgba(26,35,126,0.15);
        }
        .success-card::before {
            content:''; position:absolute; top:-30px; right:-30px; width:100px; height:100px;
            background:radial-gradient(circle, rgba(255,109,0,0.15) 0%, transparent 70%); border-radius:50%;
        }
        .success-card::after {
            content:''; position:absolute; bottom:-20px; left:-20px; width:80px; height:80px;
            background:radial-gradient(circle, rgba(46,125,50,0.12) 0%, transparent 70%); border-radius:50%;
        }
        .success-card .success-icon { font-size:4rem; margin-bottom:8px; animation:bounceIn 0.6s ease; }
        @keyframes bounceIn {
            0% { transform:scale(0); opacity:0; }
            50% { transform:scale(1.15); }
            100% { transform:scale(1); opacity:1; }
        }
        .success-card .success-title { font-size:1.4rem; font-weight:800; color:#2e7d32; margin-bottom:4px; }
        .success-card .reg-id-label { font-size:0.85rem; color:#616161; font-weight:600; text-transform:uppercase; letter-spacing:1px; }
        .success-card .reg-id-value {
            font-size:2rem; font-weight:900; color:#ff6d00; letter-spacing:2px; margin:4px 0 12px;
            background:#fff8e1; display:inline-block; padding:8px 20px; border-radius:30px;
        }
        .success-card .info-row {
            display:flex; justify-content:space-between; padding:6px 0;
            border-bottom:1px dashed #e0e0e0; font-size:0.9rem;
        }
        .success-card .info-row .label { font-weight:600; color:#1a237e; }
        .success-card .info-row .value { color:#424242; text-align:right; }
        .success-card .watermark {
            position:absolute; bottom:10px; right:15px; font-size:0.65rem; color:#bdbdbd; font-style:italic;
        }
        .tabs { display:flex; gap:8px; margin-bottom:16px; }
        .tab-btn {
            flex:1; padding:8px 12px; border:2px solid var(--border); background:#fafafa;
            border-radius:20px; cursor:pointer; font-weight:600; font-size:0.85rem;
            transition:var(--transition); text-align:center;
        }
        .tab-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        .table-container {
            overflow-x: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        table th,
        table td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        table th {
            background: #f8f9ff;
            font-weight: 700;
            color: var(--primary);
        }

        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            border-bottom: 2px solid #eee;
            padding-bottom: 4px;
        }

        .tab-btn {
            padding: 9px 18px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            border-radius: 20px 20px 0 0;
            transition: var(--transition);
            font-size: 0.85rem;
            color: var(--text-light);
            position: relative;
        }

        .tab-btn.active {
            color: var(--primary);
            background: #e8eaf6;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="bg-particles" id="bgParticles"></div>
    <div id="root" class="app-container"></div>
    <div id="toastContainer"></div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBB4caiGCLBbTulWTwV1p5pgjyU_SKjTxI",
            authDomain: "rjfse2026.firebaseapp.com",
            databaseURL: "https://rjfse2026-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rjfse2026",
            storageBucket: "rjfse2026.firebasestorage.app",
            messagingSenderId: "39296282344",

            measurementId: "G-HG228HY13Z"

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const rtdb = firebase.database();
        const TELEGRAM_WORKER_URL = 'https://weathered-pond-e88e.rjf2931639.workers.dev/';

        // App State
        const AppState = {
            currentPortal: null,
            pendingCroppedBlob: null,
            pendingCroppedDataURL: null,
            _qrScanner: null
        };

        function showToast(message, type = '', position = 'bottom') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const positionClass = position === 'top' ? 'toast-top' : 'toast';
            toast.className = `${positionClass} toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }

        function generateRegID() { return 'RJFSE26-' + Math.floor(100000 + Math.random() * 900000); }
        function escapeHTML(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

        function createParticles() {
            const container = document.getElementById('bgParticles');
            for (let i = 0; i < 35; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 80 + 20;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 18 + 10 + 's';
                particle.style.animationDelay = Math.random() * 15 + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        const root = document.getElementById('root');

        function renderApp() {
            if (!AppState.currentPortal) renderLandingPage();
            else if (AppState.currentPortal === 'student-reg') renderStudentRegistration();
            else if (AppState.currentPortal === 'student-assist') renderStudentAssistant();
            else renderLandingPage();
        }

        function renderLandingPage() {
            root.innerHTML = `
                <div class="app-header no-print">
                    <div class="header-logo">
                        <div class="logo-icon">
                            <img src="RJFSE26-LOGO.webp" alt="Roktojoba Foundation Logo">
                        </div>
                        <div>
                            <div class="header-title">RJFSE 2026</div>
                            <div class="header-subtitle">EMPOWERING FUTURE LEADERS</div>
                        </div>
                    </div>
                </div>
                <div style="text-align:center;padding:30px 0;">
                    <h2 style="color:var(--primary);">Welcome to Roktojoba Foundation Scholarship Examination - 2026</h2>
                    <p style="color:var(--text-light);margin-bottom:30px;">Select a portal</p>
                </div>
                <div style="max-width:1100px;margin:0 auto; display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr));">
                    <div class="card" style="cursor:pointer;text-align:center;border-left:4px solid var(--accent);" onclick="navigateTo('student-reg')">
                        <div style="font-size:3rem;">📝</div>
                        <div class="card-header" style="justify-content:center;">Student Registration</div>
                        <button class="btn btn-primary mt-2">Register Now</button>
                    </div>
                    <div class="card" style="cursor:pointer;text-align:center;border-left:4px solid #0277bd;" onclick="navigateTo('student-assist')">
                        <div style="font-size:3rem;">🔍</div>
                        <div class="card-header" style="justify-content:center;">Student Assistant</div>

                <footer class="footer">
                    <p>© 2026 RJF Scholarship Examination. All rights reserved.</p>
                    <p>Powered by FT Innovation</p>

                    <p>Design & Developed by <a href="https://www.facebook.com/md.tasrik.hossain">Tasrik Hossain</a> & <a href="https://www.facebook.com/siyam696">Siyam</a></p>

            `;
        }

        function navigateTo(portal) {
            if (AppState._qrScanner) { try { AppState._qrScanner.stop(); } catch(e){} AppState._qrScanner = null; }
            AppState.currentPortal = portal;
            renderApp();
        }

        async function uploadToTelegram(file) {
            const formData = new FormData();
            formData.append('image', file);
            const response = await fetch(TELEGRAM_WORKER_URL, { method: 'POST', body: formData });
            const result = await response.json();
            if (result.success) return result.url;
            else throw new Error('Telegram upload failed: ' + (result.error || 'Unknown error'));
        }

        async function downloadSuccessCardPNG(regID) {
            const cardElement = document.getElementById('successCardToDownload');
            if (!cardElement) { showToast('Card not found!', 'error'); return; }
            try {
                showToast('Generating PNG...', '');
                const canvas = await html2canvas(cardElement, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    logging: false,
                    useCORS: true
                });
                const link = document.createElement('a');
                link.download = `RJFSE26_Registration_${regID}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('✅ Card saved as PNG!', 'success');
            } catch (error) { showToast('Failed to save PNG', 'error'); }
        }

        // ---------- Input Validation Helpers ----------
        function filterNonEnglishInput(event) {
            const input = event.target;
            const cursorPos = input.selectionStart;
            const filteredValue = input.value.replace(/[^\x20-\x7E]/g, '');
            if (input.value !== filteredValue) {
                input.value = filteredValue;
                input.setSelectionRange(cursorPos, cursorPos);
                showToast('Only English letters, numbers, and standard punctuation are allowed.', '', 'top');
            }
        }
        function attachEnglishOnlyFilter(inputElement) {
            if (!inputElement) return;
            inputElement.addEventListener('input', filterNonEnglishInput);
            inputElement.addEventListener('blur', function() {
                const clean = inputElement.value.replace(/[^\x20-\x7E]/g, '');
                if (inputElement.value !== clean) inputElement.value = clean;
            });
        }
        function filterNameFieldInput(event) {
            const input = event.target;
            const cursorPos = input.selectionStart;
            const filteredValue = input.value.replace(/[^a-zA-Z0-9\s.\-':]/g, '');
            if (input.value !== filteredValue) {
                input.value = filteredValue;
                input.setSelectionRange(cursorPos, cursorPos);
                showToast('Only English letters, numbers, spaces, and . - \' : are allowed for this field.', '', 'top');
            }
        }
        function attachNameFieldFilter(inputElement) {
            if (!inputElement) return;
            inputElement.addEventListener('input', filterNameFieldInput);
            inputElement.addEventListener('blur', function() {
                const clean = inputElement.value.replace(/[^a-zA-Z0-9\s.\-':]/g, '');
                if (inputElement.value !== clean) inputElement.value = clean;
            });
        }
        // New: allow only digits for Class Roll
        function filterNumbersOnly(event) {
            const input = event.target;
            const cursorPos = input.selectionStart;
            const filteredValue = input.value.replace(/\D/g, '');
            if (input.value !== filteredValue) {
                input.value = filteredValue;
                input.setSelectionRange(cursorPos, cursorPos);
                showToast('Only numbers are allowed for Class Roll.', '', 'top');
            }
        }
        function attachNumberOnlyFilter(inputElement) {
            if (!inputElement) return;
            inputElement.addEventListener('input', filterNumbersOnly);
            inputElement.addEventListener('blur', function() {
                this.value = this.value.replace(/\D/g, '');
            });
        }

        // ---------- Student Registration ----------
        function renderStudentRegistration() {
            AppState.pendingCroppedBlob = null;
            AppState.pendingCroppedDataURL = null;
            root.innerHTML = `
                <div class="app-header no-print">
                    <div class="header-logo">
                        <div class="logo-icon">
                            <img src="RJFSE26-LOGO.webp" alt="Roktojoba Foundation Logo">
                        </div>
                        <div>
                            <div class="header-title">Student Registration</div>
                            <div class="header-subtitle">RJFSE 2026</div>
                        </div>
                    </div>
                    <div class="header-actions"><button class="btn btn-outline btn-sm" onclick="navigateTo(null)">🏠 Home</button></div>
                </div>
                <div class="card" style="max-width:650px;margin:0 auto;">
                    <div class="card-header">📝 Registration Form</div>
                    <form id="studentRegForm" onsubmit="handleStudentRegistration(event)">
                        <div class="form-row">
                            <div class="form-group"><label>Full Name *</label><input type="text" id="regName" required autocomplete="off"></div>
                            <div class="form-group"><label>Father's Name *</label><input type="text" id="regFather" required autocomplete="off"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Mother's Name *</label><input type="text" id="regMother" required autocomplete="off"></div>
                            <div class="form-group"><label>Date of Birth *</label><input type="date" id="regDob" required></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Class Roll *</label><input type="text" id="regRoll" required autocomplete="off" pattern="[0-9]*" inputmode="numeric"></div>
                            <div class="form-group"><label>Class *</label><select id="regClass" required onchange="handleClassChange()"><option value="">Select</option><option value="8">Class 8</option><option value="9">Class 9</option><option value="10">Class 10</option></select></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Group *</label><select id="regGroup" required><option value="">Select</option></select></div>
                            <div class="form-group"><label>Gender *</label><select id="regGender" required><option value="">Select</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Mobile Number *</label><input type="tel" id="regMobile" required placeholder="01XXXXXXXXX" pattern="01[0-9]{9}" autocomplete="off"></div>
                            <div class="form-group"><label>Student Picture *</label><input type="file" id="regPictureFile" required accept="image/*" onchange="handlePictureFileSelect(event)"></div>
                        </div>
                        <div id="regPreview" style="text-align:center;margin:10px 0;"></div>
                        <button type="submit" class="btn btn-primary w-full mt-2" id="regSubmitBtn">📋 Register Now</button>
                    </form>
                    <div id="regResult" style="margin-top:16px;"></div>
                </div>
                <footer class="footer">
                    <p>© 2026 RJF Scholarship Examination. All rights reserved.</p>
                    <p>Powered by FT Innovation</p>
                    <p>Contact us for any need. <a href="https://roktojobafoundation.github.io/qr/">Roktojoba Foundation</a></p>
                    <p>Design & Developed by <a href="https://www.facebook.com/md.tasrik.hossain">Tasrik Hossain</a> & <a href="https://www.facebook.com/siyam696">Siyam</a></p>
                </footer>`;

            // Attach name filters (excluding roll)
            ['regName', 'regFather', 'regMother'].forEach(id => {
                const el = document.getElementById(id);
                if (el) attachNameFieldFilter(el);
            });
            // Attach number-only filter for roll
            const rollEl = document.getElementById('regRoll');
            if (rollEl) attachNumberOnlyFilter(rollEl);

            const mobileEl = document.getElementById('regMobile');
            if (mobileEl) {
                mobileEl.addEventListener('input', function(e) { this.value = this.value.replace(/\D/g, ''); });
            }
            handleClassChange();
        }

        function handleClassChange() {
            const classSelect = document.getElementById('regClass');
            const groupSelect = document.getElementById('regGroup');
            if (!classSelect || !groupSelect) return;
            const val = classSelect.value;
            groupSelect.innerHTML = '<option value="">Select Group</option>';
            if (val === '8') {
                groupSelect.innerHTML = '<option value="Junior" selected>Junior</option>';
                groupSelect.disabled = true;
            } else if (val === '9' || val === '10') {
                ['Science','Arts','Commerce','Vocational'].forEach(g => groupSelect.innerHTML += `<option value="${g}">${g}</option>`);
                groupSelect.disabled = false;
            } else { groupSelect.disabled = false; }
        }

        function handlePictureFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { showCropModal(e.target.result); };
            reader.readAsDataURL(file);
        }

        function showCropModal(imageDataURL) {
            const existing = document.getElementById('cropModal');
            if (existing) existing.remove();
            const modalHTML = `<div class="modal-overlay" id="cropModal" onclick="if(event.target===this)this.remove()"><div class="modal"><h3 style="margin-bottom:12px;">✂️ Crop Picture (1:1)</h3><div><img id="cropImage" src="${imageDataURL}" style="max-width:100%;display:block;"></div><div style="display:flex;gap:10px;justify-content:center;margin-top:12px;"><button class="btn btn-primary btn-sm" onclick="cropAndSave()">✅ Crop & Use</button><button class="btn btn-ghost btn-sm" onclick="document.getElementById('cropModal').remove()">Cancel</button></div></div></div>`;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
            const image = document.getElementById('cropImage');
            if (image) window._currentCropper = new Cropper(image, { aspectRatio: 1, viewMode: 1, autoCropArea: 1 });
        }

        function cropAndSave() {
            const cropper = window._currentCropper;
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ width: 600, height: 600 });
            canvas.toBlob((blob) => {
                AppState.pendingCroppedBlob = blob;
                AppState.pendingCroppedDataURL = canvas.toDataURL('image/jpeg', 1.0);
                const preview = document.getElementById('regPreview');
                if (preview) preview.innerHTML = `<img src="${AppState.pendingCroppedDataURL}" style="width:100px;height:100px;object-fit:cover;border:3px solid var(--primary);">`;
                document.getElementById('cropModal')?.remove();
                cropper.destroy();
                window._currentCropper = null;
                showToast('High-quality picture cropped!', 'success');
            }, 'image/jpeg', 1.0);
        }

        async function handleStudentRegistration(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('regSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Registering...';
            const regID = generateRegID();
            if (!AppState.pendingCroppedBlob) {
                showToast('Please upload and crop a picture.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '📋 Register Now'; return;
            }
            const sanitizeName = (str) => str.replace(/[^a-zA-Z0-9\s.\-':]/g, '').trim();
            const sanitizeNumberOnly = (str) => str.replace(/\D/g, '').trim(); // digits only for roll

            const studentData = {
                registrationID: regID,
                name: sanitizeName(document.getElementById('regName').value),
                fatherName: sanitizeName(document.getElementById('regFather').value),
                motherName: sanitizeName(document.getElementById('regMother').value),
                dateOfBirth: document.getElementById('regDob').value,
                classRoll: sanitizeNumberOnly(document.getElementById('regRoll').value),
                class: document.getElementById('regClass').value,
                group: document.getElementById('regGroup').value,
                gender: document.getElementById('regGender').value,
                mobile: document.getElementById('regMobile').value.trim(),
                examRoomNumber: '',
                sitNumber: '',
                status: 'Registered',
                pictureURL: ''
            };

            try {
                const dup = await db.collection('students').where('mobile', '==', studentData.mobile).get();
                if (!dup.empty) throw new Error('Mobile already registered.');
                const uploadedUrl = await uploadToTelegram(AppState.pendingCroppedBlob);
                studentData.pictureURL = uploadedUrl;
                await db.collection('students').doc(regID).set(studentData);
                await rtdb.ref('students/' + regID).set({ ...studentData, createdAt: Date.now() });

                const qrCodeURL = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(regID)}&bgcolor=ffffff&color=1a237e`;

                const successCardHTML = `
                    <div id="successCardToDownload" class="success-card" style="max-width:450px;margin:0 auto;">
                        <div class="success-icon">✅</div>
                        <div class="success-title">Registration Successful!</div>
                        <p class="reg-id-label">Your Registration ID</p>
                        <div class="reg-id-value">${regID}</div>
                        <div style="text-align:center; margin:10px 0;">
                            <img src="${AppState.pendingCroppedDataURL}" alt="Student Photo" style="width:90px;height:90px;object-fit:cover;border:2px solid var(--primary);" crossorigin="anonymous">
                        </div>
                        <div class="info-row"><span class="label">Full Name</span><span class="value">${escapeHTML(studentData.name)}</span></div>
                        <div class="info-row"><span class="label">Date of Birth</span><span class="value">${studentData.dateOfBirth}</span></div>
                        <div class="info-row"><span class="label">Gender</span><span class="value">${studentData.gender}</span></div>
                        <div class="info-row"><span class="label">Class Roll</span><span class="value">${studentData.classRoll}</span></div>
                        <div class="info-row"><span class="label">Class</span><span class="value">${studentData.class}</span></div>
                        <div class="info-row"><span class="label">Group</span><span class="value">${studentData.group}</span></div>
                        <div class="info-row"><span class="label">Mobile</span><span class="value">${studentData.mobile}</span></div>
                        <div style="text-align:center; margin-top:12px;">
                            <img src="${qrCodeURL}" alt="QR Code" style="width:50px;height:50px;" crossorigin="anonymous">
                            <div style="font-size:0.65rem; color:#1a237e; font-weight:700; letter-spacing:1px;">📱 Scan QR Code</div>
                        </div>
                        <div class="watermark">RJFSE 2026</div>
                    </div>
                    <div style="text-align:center;margin-top:20px;">
                        <button class="btn btn-gallery" onclick="downloadSuccessCardPNG('${regID}')">💾 Save as PNG</button>
                    </div>
                `;
                document.getElementById('regResult').innerHTML = successCardHTML;
                document.getElementById('studentRegForm').reset();
                document.getElementById('regPreview').innerHTML = '';
                AppState.pendingCroppedBlob = null;
                AppState.pendingCroppedDataURL = null;
                showToast('Registration successful! Card ready.', 'success');
            } catch (e) {
                showToast(e.message, 'error');
                alert('Error: ' + e.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '📋 Register Now';
            }
        }

        // ---------- Student Assistant ----------
        function renderStudentAssistant() {
            root.innerHTML = `
                <div class="app-header no-print">
                    <div class="header-logo">
                        <div class="logo-icon">
                            <img src="RJFSE26-LOGO.webp" alt="Roktojoba Foundation Logo">
                        </div>
                        <div>
                            <div class="header-title">Student Assistant Portal</div>
                            <div class="header-subtitle">Check Your Status</div>
                        </div>
                    </div>
                    <div class="header-actions"><button class="btn btn-outline btn-sm" onclick="navigateTo(null)">🏠 Home</button></div>
                </div>
                <div class="card" style="max-width:600px;margin:0 auto;">
                    <div class="card-header">🔍 Find Your Registration</div>
                    <div class="tabs">
                        <button class="tab-btn active" onclick="switchSATab('manual', this)">🔢 Enter ID/Mobile</button>
                        <button class="tab-btn" onclick="switchSATab('qr', this)">📷 Scan QR Code</button>
                    </div>
                    <div id="saManualSearch">
                        <div class="form-group"><label>Registration ID or Mobile Number</label><input type="text" id="saSearchInput" placeholder="RJFSE26-XXXXXX or 01XXXXXXXXX" autocomplete="off"></div>
                        <button class="btn btn-primary w-full" onclick="searchStudentAssistant()">🔍 Search</button>
                    </div>
                    <div id="saQRSearch" style="display:none;">
                        <div id="saQRReader" style="max-width:350px;margin:0 auto;"></div>
                        <p class="text-center mt-2" style="color:var(--text-light);font-size:0.8rem;">Point camera at student's QR code</p>
                        <button class="btn btn-ghost btn-sm w-full mt-2" id="saStopQR" style="display:none;" onclick="stopSAQRScanner()">⏹️ Stop Scanner</button>
                    </div>
                    <div id="saResult" style="margin-top:16px;"></div>
                </div>
                <footer class="footer">
                    <p>© 2026 RJF Scholarship Examination. All rights reserved.</p>
                    <p>Powered by FT Innovation</p>
                    <p>Contact us for any need. <a href="https://roktojobafoundation.github.io/qr/">Roktojoba Foundation</a></p>
                    <p>Design & Developed by <a href="https://www.facebook.com/md.tasrik.hossain">Tasrik Hossain</a> & <a href="https://www.facebook.com/siyam696">Siyam</a></p>
                </footer>`;
            const searchInput = document.getElementById('saSearchInput');
            if (searchInput) attachEnglishOnlyFilter(searchInput);
            if (AppState._qrScanner) { try { AppState._qrScanner.stop(); } catch(e){} AppState._qrScanner = null; }
        }

        function switchSATab(tab, btn) {
            document.querySelectorAll('#root .tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            const manualEl = document.getElementById('saManualSearch');
            const qrEl = document.getElementById('saQRSearch');
            if (manualEl) manualEl.style.display = tab === 'manual' ? 'block' : 'none';
            if (qrEl) qrEl.style.display = tab === 'qr' ? 'block' : 'none';
            if (tab === 'qr') initSAQRScanner();
            else stopSAQRScanner();
        }

        function initSAQRScanner() {
            const readerEl = document.getElementById('saQRReader');
            if (!readerEl || AppState._qrScanner) return;
            readerEl.innerHTML = '';
            const scanner = new Html5Qrcode('saQRReader');
            AppState._qrScanner = scanner;
            const stopBtn = document.getElementById('saStopQR');
            if (stopBtn) stopBtn.style.display = 'block';
            scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 220, height: 220 } },
                (decodedText) => {
                    document.getElementById('saSearchInput').value = decodedText;
                    stopSAQRScanner();
                    searchStudentAssistant();
                }, () => {}
            ).catch(() => { showToast('Camera access denied', 'error'); if (stopBtn) stopBtn.style.display = 'none'; });
        }

        function stopSAQRScanner() {
            if (AppState._qrScanner) { AppState._qrScanner.stop().catch(()=>{}); AppState._qrScanner = null; }
            const stopBtn = document.getElementById('saStopQR');
            if (stopBtn) stopBtn.style.display = 'none';
            const readerEl = document.getElementById('saQRReader');
            if (readerEl) readerEl.innerHTML = '<p class="text-center" style="color:var(--text-light);">Scanner stopped.</p>';
        }

        async function searchStudentAssistant() {
            const input = document.getElementById('saSearchInput').value.trim();
            const resultDiv = document.getElementById('saResult');
            if (!input) {
                resultDiv.innerHTML = '<p style="color:var(--danger);">Please enter Registration ID or Mobile.</p>';
                return;
            }
            resultDiv.innerHTML = '<div class="spinner"></div>';
            try {
                let docSnap;
                if (input.startsWith('RJFSE26-')) docSnap = await db.collection('students').doc(input).get();
                else {
                    const qSnap = await db.collection('students').where('mobile', '==', input).limit(1).get();
                    docSnap = qSnap.empty ? null : qSnap.docs[0];
                }
                if (!docSnap || !docSnap.exists) {
                    resultDiv.innerHTML = '<p style="color:var(--danger);">❌ No student found.</p>';
                    return;
                }
                const student = docSnap.data();
                const regID = docSnap.id || student.registrationID;
                const statusColor = student.present ? 'badge-success' : student.checkedIn ? 'badge-info' : 'badge-warning';
                const statusText = student.present ? 'Present' : student.checkedIn ? 'Checked In' : 'Registered';
                
                // FIX: Removed crossorigin, hide on error (original behavior)
                const pictureHTML = student.pictureURL 
                    ? `<div style="text-align:center;margin-top:12px;">
                        <img src="${student.pictureURL}" 
                             style="width:80px;height:80px;object-fit:cover;border-radius:50%;border:3px solid var(--primary);" 
                             onerror="this.style.display='none'">
                       </div>` 
                    : '';
                
                resultDiv.innerHTML = `
              <div style="background:#f8f9ff;padding:20px;border-radius:12px;animation:fadeInUp 0.5s ease;">
                <h3 style="color:var(--primary);text-align:center;">📋 Student Details</h3>
                <table style="width:100%;margin-top:12px;">
                  <tr><td style="font-weight:700;color:var(--text-light);">Registration ID</td><td><strong>${regID}</strong></td></tr>
                  <tr><td style="font-weight:700;color:var(--text-light);">Name</td><td>${escapeHTML(student.name)}</td></tr>
                  <tr><td style="font-weight:700;color:var(--text-light);">Father</td><td>${escapeHTML(student.fatherName)}</td></tr>
                  <tr><td style="font-weight:700;color:var(--text-light);">Mother</td><td>${escapeHTML(student.motherName)}</td></tr>
                  <tr><td style="font-weight:700;color:var(--text-light);">DOB</td><td>${student.dateOfBirth || 'N/A'}</td></tr>
                  <tr><td style="font-weight:700;color:var(--text-light);">Class</td><td>${student.class}</td></tr>
                  <tr><td style="font-weight:700;color:var(--text-light);">Group</td><td>${student.group}</td></tr>
                  <tr><td style="font-weight:700;color:var(--text-light);">Class Roll</td><td>${student.classRoll}</td></tr>
                  <tr><td style="font-weight:700;color:var(--text-light);">Gender</td><td>${student.gender}</td></tr>
                  <tr><td style="font-weight:700;color:var(--text-light);">Mobile</td><td>${student.mobile}</td></tr>
                  <tr><td style="font-weight:700;color:var(--text-light);">Status</td><td><span class="badge ${statusColor}">${statusText}</span></td></tr>
                  <tr style="background:#fff9c4;"><td style="font-weight:700;color:var(--primary);">🏦 Exam Room</td><td><strong style="font-size:1.3rem;color:var(--accent);">${student.examRoomNumber || 'Not Assigned Yet'}</strong></td></tr>
                  <tr style="background:#fff9c4;"><td style="font-weight:700;color:var(--primary);">💺 Sit Number</td><td><strong style="font-size:1.3rem;color:var(--accent);">${student.sitNumber || 'Not Assigned Yet'}</strong></td></tr>
                </table>
                ${pictureHTML}
                ${student.examRoomNumber ? `<div style="text-align:center;margin-top:12px;"><button class="btn btn-primary btn-sm" onclick="window.print()">🖨️ Print Details</button></div>` : '<p style="text-align:center;color:var(--warning);">⚠️ Exam room & seat not yet assigned. Please check back later.</p>'}
              </div>
            `;
            } catch (error) {
                resultDiv.innerHTML = `<p style="color:var(--danger);text-align:center;">Error: ${error.message}</p>`;
            }
        }

        // Global exposure
        window.navigateTo = navigateTo;
        window.handleStudentRegistration = handleStudentRegistration;
        window.downloadSuccessCardPNG = downloadSuccessCardPNG;
        window.handlePictureFileSelect = handlePictureFileSelect;
        window.cropAndSave = cropAndSave;
        window.handleClassChange = handleClassChange;
        window.switchSATab = switchSATab;
        window.searchStudentAssistant = searchStudentAssistant;
        window.stopSAQRScanner = stopSAQRScanner;

        document.addEventListener('DOMContentLoaded', () => renderLandingPage());
    </script>
</body>
</html>
